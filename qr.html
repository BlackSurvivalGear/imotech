<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator — ImoTech</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-white text-slate-900 p-6">

<h2 class="text-2xl font-extrabold mb-6">QR Code Generator</h2>

<div class="grid md:grid-cols-2 gap-8">

<!-- INPUT -->
<div class="space-y-4">
<div>
<label class="block text-sm font-semibold text-slate-700 mb-1">Content</label>
<textarea id="qr-text" rows="3" placeholder="Enter URL, text, email, phone…"
  class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-600"></textarea>
</div>

<div><label for="qr-heading" class="block text-sm font-semibold text-slate-700 mb-1">Top Text (optional)</label><input id="qr-heading" maxlength="80" placeholder="e.g. SCAN TO VISIT OUR WEBSITE" class="w-full border border-slate-300 rounded-xl px-4 py-3"></div>

<div class="grid grid-cols-2 gap-4">
<div>
<label class="block text-sm font-semibold text-slate-700 mb-1">Size (px)</label>
<input id="qr-size" type="number" value="256" min="64" max="1024" step="32"
  class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-600">
</div>
<div>
<label class="block text-sm font-semibold text-slate-700 mb-1">Error Correction</label>
<select id="qr-ec"
  class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-600">
<option value="L">Low (7%)</option>
<option value="M" selected>Medium (15%)</option>
<option value="Q">Quartile (25%)</option>
<option value="H">High (30%)</option>
</select>
</div>
</div>

<div class="grid grid-cols-2 gap-4">
<div>
<label class="block text-sm font-semibold text-slate-700 mb-1">Foreground</label>
<div class="flex items-center gap-2">
<input id="qr-fg" type="color" value="#0f172a" class="w-10 h-10 rounded cursor-pointer border-0">
<span id="qr-fg-hex" class="text-sm text-slate-500">#0f172a</span>
</div>
</div>
<div>
<label class="block text-sm font-semibold text-slate-700 mb-1">Background</label>
<div class="flex items-center gap-2">
<input id="qr-bg" type="color" value="#f8fafc" class="w-10 h-10 rounded cursor-pointer border-0">
<span id="qr-bg-hex" class="text-sm text-slate-500">#f8fafc</span>
</div>
</div>
</div>

<div class="flex gap-3 flex-wrap">
<button onclick="presetTheme('#0f172a','#f8fafc')" class="text-xs px-3 py-1 rounded-full bg-slate-900 text-white font-semibold">Slate</button>
<button onclick="presetTheme('#1e40af','#eff6ff')" class="text-xs px-3 py-1 rounded-full bg-blue-700 text-white font-semibold">Blue</button>
<button onclick="presetTheme('#0f172a','#ffffff')" class="text-xs px-3 py-1 rounded-full bg-slate-900 text-white font-semibold border border-slate-300">Classic</button>
</div>

<div><label for="qr-style" class="block text-sm font-semibold text-slate-700 mb-1">QR Style</label><select id="qr-style" class="w-full border border-slate-300 rounded-xl px-4 py-3"><option value="square">Classic Square</option><option value="rounded">Rounded</option><option value="dots">Dot Matrix</option><option value="gold">Premium Gold</option></select></div>

<button onclick="generateQR()"
  class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold hover:bg-blue-600 transition">
Generate QR Code
</button>
</div>

<!-- OUTPUT -->
<div class="flex flex-col items-center justify-center">
<div id="qr-output" class="bg-slate-50 border border-slate-200 rounded-2xl p-8 flex items-center justify-center min-h-[300px]">
<p class="text-slate-400 text-sm">Your QR code will appear here</p>
</div>
<div id="qr-downloads" class="mt-4 flex gap-3 flex-wrap justify-center" style="display:none"><button onclick="downloadQR()" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-blue-700 transition">Download PNG</button><button onclick="downloadSVG()" class="bg-slate-900 text-white px-6 py-3 rounded-xl font-bold hover:bg-slate-700 transition">Download SVG</button></div>
</div>

</div>

<script>
const ecMap = { L: QRCode.CorrectLevel.L, M: QRCode.CorrectLevel.M, Q: QRCode.CorrectLevel.Q, H: QRCode.CorrectLevel.H };
let qrInstance = null;

document.getElementById('qr-fg').addEventListener('input', e => {
  document.getElementById('qr-fg-hex').textContent = e.target.value;
});
document.getElementById('qr-bg').addEventListener('input', e => {
  document.getElementById('qr-bg-hex').textContent = e.target.value;
});

function presetTheme(fg, bg) {
  document.getElementById('qr-fg').value = fg;
  document.getElementById('qr-bg').value = bg;
  document.getElementById('qr-fg-hex').textContent = fg;
  document.getElementById('qr-bg-hex').textContent = bg;
}

const BRAND = 'www.ImoTech.Solutions';
let currentSVG = '';
function escapeXML(value) {
  return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
}
function contrastRatio(a, b) {
  const lum = hex => {
    const n = hex.slice(1).match(/../g).map(v => parseInt(v,16)/255)
      .map(v => v <= 0.04045 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4));
    return n[0]*0.2126+n[1]*0.7152+n[2]*0.0722;
  };
  const x=lum(a), y=lum(b);
  return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05);
}
function generateQR() {
  const text = document.getElementById('qr-text').value.trim();
  if (!text) { alert('Please enter some content.'); return; }
  const size = Math.max(64, Math.min(1024, parseInt(document.getElementById('qr-size').value,10) || 256));
  const ec = document.getElementById('qr-ec').value;
  const style = document.getElementById('qr-style').value;
  const heading = document.getElementById('qr-heading').value.trim();
  const fg = style === 'gold' ? '#e8bf62' : document.getElementById('qr-fg').value;
  const bg = style === 'gold' ? '#101827' : document.getElementById('qr-bg').value;
  if (contrastRatio(fg,bg) < 4.5) {
    alert('Choose QR colours with higher contrast for reliable scanning.');
    return;
  }
  const output = document.getElementById('qr-output');
  const staging = document.createElement('div');
  staging.style.cssText = 'position:absolute;left:-99999px;top:0';
  document.body.appendChild(staging);
  try {
    qrInstance = new QRCode(staging, {
      text, width: 512, height: 512, colorDark: '#000000',
      colorLight: '#ffffff', correctLevel: ecMap[ec]
    });
    const count = qrInstance._oQRCode.getModuleCount();
    const modules = qrInstance._oQRCode.modules;
    const quiet = 4;
    const unit = size / (count + quiet * 2);
    const pad = Math.max(14, Math.round(size * 0.075));
    const fontSize = Math.max(12, Math.round(size * 0.065));
    const titleHeight = heading ? fontSize * 2.8 : 0;
    const footerHeight = fontSize * 2.8;
    const width = size + pad * 2;
    const height = size + pad * 2 + titleHeight + footerHeight;
    const x0 = pad + quiet * unit, y0 = pad + titleHeight + quiet * unit;
    const pieces = [];
    for (let y=0; y<count; y++) for (let x=0; x<count; x++) {
      if (!modules[y][x]) continue;
      // Preserve the square finder patterns for robust detection.
      const finder = (x<7 && y<7) || (x>=count-7 && y<7) || (x<7 && y>=count-7);
      const mode = finder ? 'square' : style;
      const px = x0+x*unit, py = y0+y*unit;
      if (mode === 'dots') {
        pieces.push('<circle cx="'+(px+unit/2)+'" cy="'+(py+unit/2)+'" r="'+(unit*0.46)+'"/>');
      } else {
        pieces.push('<rect x="'+px+'" y="'+py+'" width="'+(unit+0.01)+'" height="'+(unit+0.01)+'"'+(mode==='rounded'?' rx="'+(unit*0.27)+'"':'')+'/>');
      }
    }
    const headingY = pad + fontSize * 1.2;
    const footerY = pad + titleHeight + size + fontSize * 1.7;
    currentSVG = '<svg xmlns="http://www.w3.org/2000/svg" width="'+width+'" height="'+height+'" viewBox="0 0 '+width+' '+height+'">'+
      '<rect width="100%" height="100%" fill="'+bg+'"/>'+
      (heading ? '<text x="'+width/2+'" y="'+headingY+'" text-anchor="middle" font-family="Arial,sans-serif" font-size="'+fontSize+'" font-weight="bold" fill="'+fg+'">'+escapeXML(heading)+'</text>' : '')+
      '<g fill="'+fg+'">'+pieces.join('')+'</g>'+
      '<text x="'+width/2+'" y="'+footerY+'" text-anchor="middle" font-family="Arial,sans-serif" font-size="'+fontSize+'" font-weight="bold" fill="'+fg+'">'+BRAND+'</text></svg>';
    output.replaceChildren();
    const preview = document.createElement('img');
    preview.alt = 'Generated QR code with ImoTech branding';
    preview.style.cssText = 'display:block;max-width:100%;height:auto';
    preview.src = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(currentSVG);
    output.appendChild(preview);
    document.getElementById('qr-downloads').style.display = 'flex';
  } catch (error) {
    currentSVG = '';
    document.getElementById('qr-downloads').style.display = 'none';
    alert('Unable to generate QR code. Try shorter content or lower error correction.');
  } finally {
    staging.remove();
  }
}
function saveBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = filename;
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function downloadSVG() {
  if (!currentSVG) return;
  saveBlob(new Blob([currentSVG], {type:'image/svg+xml;charset=utf-8'}), 'imotech-qr.svg');
}
function downloadQR() {
  if (!currentSVG) return;
  const svg = new Blob([currentSVG], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(svg);
  const image = new Image();
  image.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = image.naturalWidth; canvas.height = image.naturalHeight;
    canvas.getContext('2d').drawImage(image,0,0);
    URL.revokeObjectURL(url);
    canvas.toBlob(blob => { if (blob) saveBlob(blob,'imotech-qr.png'); }, 'image/png');
  };
  image.onerror = () => { URL.revokeObjectURL(url); alert('Unable to export PNG.'); };
  image.src = url;
}
</script>
</body>
</html>
