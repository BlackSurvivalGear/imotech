<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ImoTech Consultation</title><script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif}.choice{transition:.2s}.choice.selected{background:#2563eb;color:#fff;border-color:#2563eb}.bubble{animation:in .25s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.dot{animation:pulse 1s infinite}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}.summary-card{background:linear-gradient(135deg,#eff6ff,#f8fafc)}</style>
</head><body class="bg-slate-100 text-slate-900 min-h-screen">
<main class="max-w-2xl mx-auto p-4 md:p-8"><div class="bg-white rounded-3xl shadow-sm border overflow-hidden">
<header class="bg-slate-950 text-white p-5 flex items-center gap-3"><div class="w-11 h-11 rounded-xl bg-blue-600 flex items-center justify-center font-extrabold">iM</div><div><h1 class="font-extrabold">ImoTech Project Assistant</h1><p class="text-xs text-slate-400">A quick conversation about what you need</p></div></header>
<div class="h-1 bg-slate-100"><div id="progress" class="h-full bg-blue-600 transition-all" style="width:10%"></div></div>
<section id="chat" class="p-5 md:p-7 min-h-[420px]"></section><div id="controls" class="px-5 md:px-7 pb-6 flex justify-between gap-3"></div></div></main>
<script>
const questions=[
{q:"Hi — I'm the ImoTech project assistant. What would you like some help with?",multi:true,opts:["Business management system","AI or automation","Website / web platform","Internal dashboard","Customer portal","AI assistant / chatbot","Workflow integration","I'm not sure — advise me"]},
{lead:"Good choice. Let's understand the problem before thinking about the technology.",q:"What problem are you trying to solve? Tell me what feels slow, repetitive or difficult at the moment.",text:true,ph:"A few sentences is enough..."},
{lead:"That gives me some useful context. Now let's look at who the system needs to work for.",q:"Who would mainly use the system?",multi:true,opts:["Me","Staff / team","Customers","Management","Suppliers / partners","Public users"]},
{lead:"Understood. Knowing what you already use helps us avoid replacing things that still work.",q:"What are you using at the moment?",multi:true,opts:["Spreadsheets","Email / manual processes","Google Workspace","Existing website","CRM / business software","Paper / forms","Nothing yet"]},
{lead:"We're getting a clearer picture. Let's focus on the outcome you want.",q:"What would you like the new system to do?",multi:true,opts:["Automate repetitive work","Manage customers","Manage staff","Generate documents / reports","Analyse data","Use AI","Take bookings","Accept payments","Send emails / notifications","Dashboards / reporting","Something else"]},
{lead:"That makes sense. One more technical question so we can understand the wider setup.",q:"Does it need to connect with anything you already use?",multi:true,opts:["Google Workspace","Stripe / PayPal","Accounting software","CRM","Existing website","Other APIs / software","Not sure"]},
{lead:"Thanks. Now let's understand how far along you already are.",q:"Where are you with the project right now?",opts:["Idea only","Requirements already defined","Replacing an existing system","Improving an existing system","Partially built"]},
{lead:"Good — that helps us judge the likely pace of the project.",q:"When would you ideally like to get started?",opts:["As soon as possible","Within a month","1–3 months","3–6 months","Just researching"]},
{lead:"Nearly there. This is optional, but it helps us recommend a realistic approach.",q:"What level of investment are you considering?",opts:["Under £1,000","£1,000–£3,000","£3,000–£10,000","£10,000+","I need advice","Prefer not to say"]},
{lead:"That's enough for me to build a useful project brief.",q:"Last step. Where should we send our response?",contact:true}
];
let step=0,answers=[];const chat=document.getElementById('chat'),controls=document.getElementById('controls');
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function typing(cb){chat.innerHTML='<div class="bubble max-w-[85%] bg-slate-100 rounded-2xl rounded-tl-md p-4"><span class="dot">●</span> <span class="dot">●</span> <span class="dot">●</span></div>';controls.innerHTML='';setTimeout(cb,420)}
function render(){document.getElementById('progress').style.width=((step+1)/questions.length*100)+'%';typing(()=>{const x=questions[step];chat.innerHTML=`${x.lead?`<div class="bubble max-w-[90%] bg-blue-50 text-blue-950 rounded-2xl rounded-tl-md p-3 mb-3 text-sm">${x.lead}</div>`:''}<div class="bubble max-w-[90%] bg-slate-100 rounded-2xl rounded-tl-md p-4 mb-5"><p class="font-semibold">${x.q}</p>${x.multi?'<p class="text-xs text-slate-500 mt-2">Choose one or more.</p>':''}</div><div id="answer"></div>`;const a=document.getElementById('answer');if(x.opts)a.innerHTML='<div class="grid sm:grid-cols-2 gap-2">'+x.opts.map(o=>`<button type="button" class="choice text-left border rounded-xl p-3 text-sm font-semibold">${o}</button>`).join('')+'</div>';if(x.opts)a.querySelectorAll('.choice').forEach((button,index)=>button.addEventListener('click',()=>pick(button,x.opts[index])));if(x.text)a.innerHTML=`<textarea id="textAnswer" class="w-full border rounded-xl p-4 min-h-32" placeholder="${x.ph}">${esc(answers[step]||'')}</textarea>`;if(x.contact){let v=answers[step]||{};a.innerHTML=`<div class="space-y-3"><input id="name" class="w-full border rounded-xl p-3" placeholder="Your name" value="${esc(v.name||'')}"><input id="business" class="w-full border rounded-xl p-3" placeholder="Business / organisation (optional)" value="${esc(v.business||'')}"><input id="email" type="email" class="w-full border rounded-xl p-3" placeholder="Email address" value="${esc(v.email||'')}"><input id="phone" class="w-full border rounded-xl p-3" placeholder="Phone (optional)" value="${esc(v.phone||'')}"></div>`}restoreSelection();renderControls()})}
function restoreSelection(){const x=questions[step],v=answers[step];if(!x.opts||!v)return;document.querySelectorAll('.choice').forEach(b=>{if(x.multi&&Array.isArray(v)&&v.includes(b.textContent))b.classList.add('selected');if(!x.multi&&b.textContent===v)b.classList.add('selected')})}
function pick(el,val){const x=questions[step];if(x.multi){el.classList.toggle('selected');return}document.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');answers[step]=val}
function save(){const x=questions[step];if(x.multi)answers[step]=[...document.querySelectorAll('.choice.selected')].map(b=>b.textContent);if(x.text)answers[step]=document.getElementById('textAnswer').value.trim();if(x.contact)answers[step]={name:document.getElementById('name').value.trim(),business:document.getElementById('business').value.trim(),email:document.getElementById('email').value.trim(),phone:document.getElementById('phone').value.trim()};return x.contact?answers[step].name&&answers[step].email:Array.isArray(answers[step])?answers[step].length>0:!!answers[step]}
function renderControls(){controls.innerHTML=`${step?'<button id="backBtn" class="px-5 py-3 rounded-xl font-bold border">Back</button>':'<span></span>'}<button id="nextBtn" class="px-6 py-3 rounded-xl font-bold bg-blue-600 text-white">${step===questions.length-1?'Build my brief':'Continue'}</button>`;if(step)document.getElementById('backBtn').addEventListener('click',back);document.getElementById('nextBtn').addEventListener('click',next)}
function next(){if(!save()){alert('Please add an answer before continuing.');return}if(step<questions.length-1){step++;render()}else review()}
function back(){save();step--;render()}
function includes(i,val){return Array.isArray(answers[i])&&answers[i].includes(val)}
function classify(){const scores={"Business Management System":0,"AI & Workflow Automation":0,"Web Platform / Customer Portal":0,"Reporting & Operations Dashboard":0};(answers[0]||[]).forEach(v=>{if(v==='Business management system')scores['Business Management System']+=4;if(v==='AI or automation'||v==='AI assistant / chatbot'||v==='Workflow integration')scores['AI & Workflow Automation']+=4;if(v==='Website / web platform'||v==='Customer portal')scores['Web Platform / Customer Portal']+=4;if(v==='Internal dashboard')scores['Reporting & Operations Dashboard']+=4});(answers[4]||[]).forEach(v=>{if(['Manage customers','Manage staff'].includes(v))scores['Business Management System']+=2;if(['Automate repetitive work','Use AI','Generate documents / reports','Send emails / notifications'].includes(v))scores['AI & Workflow Automation']+=2;if(['Take bookings','Accept payments'].includes(v))scores['Web Platform / Customer Portal']+=2;if(['Analyse data','Dashboards / reporting'].includes(v))scores['Reporting & Operations Dashboard']+=2});return Object.entries(scores).sort((a,b)=>b[1]-a[1])[0][0]}
function direction(type){const map={"Business Management System":"A focused management system that brings key workflows, users and information into one operational workspace.","AI & Workflow Automation":"A practical automation layer that reduces repetitive work and uses AI only where it adds clear value.","Web Platform / Customer Portal":"A responsive web platform designed around customer access, transactions and self-service workflows.","Reporting & Operations Dashboard":"An operational dashboard that brings important activity, reporting and decision-making information into one view."};return map[type]}
function list(v){return Array.isArray(v)?v.join(', '):v}
function projectBrief(){const type=classify();return{type,direction:direction(type),problem:answers[1],users:list(answers[2]),current:list(answers[3]),features:list(answers[4]),integrations:list(answers[5]),stage:answers[6],timeline:answers[7],budget:answers[8]}}
function review(){const c=answers[9],b=projectBrief();chat.innerHTML=`<div class="bubble"><p class="text-sm text-blue-600 font-bold mb-1">I've put the pieces together.</p><h2 class="text-2xl font-extrabold mb-2">${esc(c.name)}, here's your project brief.</h2><p class="text-slate-600 mb-5">Based on your answers, this looks closest to the following ImoTech solution.</p><div class="summary-card border border-blue-100 rounded-2xl p-5 mb-5"><p class="text-xs font-bold text-blue-600 uppercase tracking-wider">Recommended solution</p><h3 class="text-xl font-extrabold mt-1">${esc(b.type)}</h3><p class="text-sm text-slate-600 mt-2">${esc(b.direction)}</p></div><div class="space-y-3 text-sm"><div><p class="font-bold">The problem</p><p class="text-slate-600">${esc(b.problem)}</p></div><div><p class="font-bold">Who it needs to serve</p><p class="text-slate-600">${esc(b.users)}</p></div><div><p class="font-bold">Capabilities requested</p><p class="text-slate-600">${esc(b.features)}</p></div><div><p class="font-bold">Existing tools / integrations</p><p class="text-slate-600">Currently: ${esc(b.current)}. Connections: ${esc(b.integrations)}.</p></div><div class="grid grid-cols-3 gap-2 pt-2"><div class="bg-slate-50 rounded-xl p-3"><p class="text-xs text-slate-400 font-bold">STAGE</p><p class="font-semibold mt-1">${esc(b.stage)}</p></div><div class="bg-slate-50 rounded-xl p-3"><p class="text-xs text-slate-400 font-bold">START</p><p class="font-semibold mt-1">${esc(b.timeline)}</p></div><div class="bg-slate-50 rounded-xl p-3"><p class="text-xs text-slate-400 font-bold">BUDGET</p><p class="font-semibold mt-1">${esc(b.budget)}</p></div></div></div></div>`;controls.innerHTML='<button id="reviewBack" class="px-5 py-3 rounded-xl font-bold border">Back</button><button id="sendBtn" class="px-6 py-3 rounded-xl font-bold bg-blue-600 text-white">Send consultation request</button>';document.getElementById('reviewBack').addEventListener('click',()=>{step=9;render()});document.getElementById('sendBtn').addEventListener('click',finish)}
function finish(){const c=answers[9],b=projectBrief();const subject=encodeURIComponent('ImoTech consultation request - '+c.name+' - '+b.type);const body=encodeURIComponent('IMOTECH PROJECT BRIEF\n\nRecommended solution: '+b.type+'\n'+b.direction+'\n\nProblem:\n'+b.problem+'\n\nUsers:\n'+b.users+'\n\nCapabilities:\n'+b.features+'\n\nCurrent tools:\n'+b.current+'\n\nIntegrations:\n'+b.integrations+'\n\nProject stage: '+b.stage+'\nPreferred start: '+b.timeline+'\nBudget: '+b.budget+'\n\nCONTACT\nName: '+c.name+'\nBusiness: '+c.business+'\nEmail: '+c.email+'\nPhone: '+c.phone);chat.innerHTML=`<div class="bubble text-center py-12"><div class="w-14 h-14 rounded-full bg-green-100 text-green-700 flex items-center justify-center mx-auto mb-4 text-2xl">✓</div><h2 class="text-2xl font-extrabold mb-3">Your ${esc(b.type)} brief is ready.</h2><p class="text-slate-600 mb-6">Your email app will open with the structured project brief prepared. Send it and ImoTech can review your requirements and respond with the next steps.</p><a class="inline-block bg-blue-600 text-white px-6 py-3 rounded-xl font-bold" href="mailto:info@imotech.solutions?subject=${subject}&body=${body}">Open email to send</a></div>`;controls.innerHTML=''}
render();
</script></body></html>
