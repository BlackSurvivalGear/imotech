<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ImoTech Consultation</title><script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif}.choice{transition:.2s}.choice.selected{background:#2563eb;color:#fff;border-color:#2563eb}.bubble{animation:in .25s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.dot{animation:pulse 1s infinite}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}</style>
</head><body class="bg-slate-100 text-slate-900 min-h-screen">
<main class="max-w-2xl mx-auto p-4 md:p-8"><div class="bg-white rounded-3xl shadow-sm border overflow-hidden">
<header class="bg-slate-950 text-white p-5 flex items-center gap-3"><div class="w-11 h-11 rounded-xl bg-blue-600 flex items-center justify-center font-extrabold">iM</div><div><h1 class="font-extrabold">ImoTech Project Assistant</h1><p class="text-xs text-slate-400">A quick conversation about what you need</p></div></header>
<div class="h-1 bg-slate-100"><div id="progress" class="h-full bg-blue-600 transition-all" style="width:10%"></div></div>
<section id="chat" class="p-5 md:p-7 min-h-[420px]"></section>
<div id="controls" class="px-5 md:px-7 pb-6 flex justify-between gap-3"></div></div></main>
<script>
const questions=[
{q:"Hi — I'm the ImoTech project assistant. What would you like some help with?",multi:true,opts:["Business management system","AI or automation","Website / web platform","Internal dashboard","Customer portal","AI assistant / chatbot","Workflow integration","I'm not sure — advise me"]},
{q:"What problem are you trying to solve? Tell me what feels slow, repetitive or difficult at the moment.",text:true,ph:"A few sentences is enough..."},
{q:"Who would mainly use the system?",multi:true,opts:["Me","Staff / team","Customers","Management","Suppliers / partners","Public users"]},
{q:"What are you using at the moment?",multi:true,opts:["Spreadsheets","Email / manual processes","Google Workspace","Existing website","CRM / business software","Paper / forms","Nothing yet"]},
{q:"What would you like the new system to do?",multi:true,opts:["Automate repetitive work","Manage customers","Manage staff","Generate documents / reports","Analyse data","Use AI","Take bookings","Accept payments","Send emails / notifications","Dashboards / reporting","Something else"]},
{q:"Does it need to connect with anything you already use?",multi:true,opts:["Google Workspace","Stripe / PayPal","Accounting software","CRM","Existing website","Other APIs / software","Not sure"]},
{q:"Where are you with the project right now?",opts:["Idea only","Requirements already defined","Replacing an existing system","Improving an existing system","Partially built"]},
{q:"When would you ideally like to get started?",opts:["As soon as possible","Within a month","1–3 months","3–6 months","Just researching"]},
{q:"Optional: what level of investment are you considering?",opts:["Under £1,000","£1,000–£3,000","£3,000–£10,000","£10,000+","I need advice","Prefer not to say"]},
{q:"Last step. Where should we send our response?",contact:true}
];
let step=0,answers=[];const chat=document.getElementById('chat'),controls=document.getElementById('controls');
function typing(cb){chat.innerHTML='<div class="bubble max-w-[85%] bg-slate-100 rounded-2xl rounded-tl-md p-4"><span class="dot">●</span> <span class="dot">●</span> <span class="dot">●</span></div>';controls.innerHTML='';setTimeout(cb,420)}
function render(){document.getElementById('progress').style.width=((step+1)/questions.length*100)+'%';typing(()=>{const x=questions[step];chat.innerHTML=`<div class="bubble max-w-[90%] bg-slate-100 rounded-2xl rounded-tl-md p-4 mb-5"><p class="font-semibold">${x.q}</p>${x.multi?'<p class="text-xs text-slate-500 mt-2">Choose one or more.</p>':''}</div><div id="answer"></div>`;const a=document.getElementById('answer');if(x.opts)a.innerHTML='<div class="grid sm:grid-cols-2 gap-2">'+x.opts.map(o=>`<button type="button" class="choice text-left border rounded-xl p-3 text-sm font-semibold" onclick="pick(this,${JSON.stringify(o)})">${o}</button>`).join('')+'</div>';if(x.text)a.innerHTML=`<textarea id="textAnswer" class="w-full border rounded-xl p-4 min-h-32" placeholder="${x.ph}">${answers[step]||''}</textarea>`;if(x.contact){let v=answers[step]||{};a.innerHTML=`<div class="space-y-3"><input id="name" class="w-full border rounded-xl p-3" placeholder="Your name" value="${v.name||''}"><input id="business" class="w-full border rounded-xl p-3" placeholder="Business / organisation (optional)" value="${v.business||''}"><input id="email" type="email" class="w-full border rounded-xl p-3" placeholder="Email address" value="${v.email||''}"><input id="phone" class="w-full border rounded-xl p-3" placeholder="Phone (optional)" value="${v.phone||''}"></div>`}renderControls()})}
function pick(el,val){const x=questions[step];if(x.multi){el.classList.toggle('selected');return}document.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');answers[step]=val}
function save(){const x=questions[step];if(x.multi)answers[step]=[...document.querySelectorAll('.choice.selected')].map(b=>b.textContent);if(x.text)answers[step]=document.getElementById('textAnswer').value.trim();if(x.contact)answers[step]={name:name.value.trim(),business:business.value.trim(),email:email.value.trim(),phone:phone.value.trim()};return x.contact?answers[step].name&&answers[step].email:Array.isArray(answers[step])?answers[step].length>0:!!answers[step]}
function renderControls(){controls.innerHTML=`${step?'<button onclick="back()" class="px-5 py-3 rounded-xl font-bold border">Back</button>':'<span></span>'}<button onclick="next()" class="px-6 py-3 rounded-xl font-bold bg-blue-600 text-white">${step===questions.length-1?'Review':'Continue'}</button>`}
function next(){if(!save()){alert('Please add an answer before continuing.');return}if(step<questions.length-1){step++;render()}else review()}
function back(){save();step--;render();setTimeout(()=>{const x=questions[step],v=answers[step];if(x.multi&&v)document.querySelectorAll('.choice').forEach(b=>{if(v.includes(b.textContent))b.classList.add('selected')});if(x.opts&&!x.multi&&v)document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===v)b.classList.add('selected')})},450)}
function review(){const contact=answers[9];const lines=questions.slice(0,9).map((q,i)=>`<div class="border-b py-3"><p class="text-xs font-bold text-slate-400 uppercase">${q.q}</p><p class="mt-1">${Array.isArray(answers[i])?answers[i].join(', '):answers[i]}</p></div>`).join('');chat.innerHTML=`<div class="bubble"><h2 class="text-2xl font-extrabold mb-2">Thanks, ${contact.name}.</h2><p class="text-slate-600 mb-5">Here is the project brief you've created. Review it before sending.</p>${lines}</div>`;controls.innerHTML='<button onclick="step=9;render()" class="px-5 py-3 rounded-xl font-bold border">Back</button><button onclick="finish()" class="px-6 py-3 rounded-xl font-bold bg-blue-600 text-white">Send consultation request</button>'}
function finish(){const c=answers[9];const subject=encodeURIComponent('ImoTech consultation request - '+c.name);const body=encodeURIComponent('Name: '+c.name+'\nBusiness: '+c.business+'\nEmail: '+c.email+'\nPhone: '+c.phone+'\n\n'+questions.slice(0,9).map((q,i)=>q.q+'\n'+(Array.isArray(answers[i])?answers[i].join(', '):answers[i])).join('\n\n'));chat.innerHTML='<div class="bubble text-center py-12"><div class="w-14 h-14 rounded-full bg-green-100 text-green-700 flex items-center justify-center mx-auto mb-4 text-2xl">✓</div><h2 class="text-2xl font-extrabold mb-3">Your project brief is ready.</h2><p class="text-slate-600 mb-6">Your email app will open with the consultation details prepared. Send it and ImoTech can review your requirements and respond with the next steps.</p><a class="inline-block bg-blue-600 text-white px-6 py-3 rounded-xl font-bold" href="mailto:info@imotech.solutions?subject='+subject+'&body='+body+'">Open email to send</a></div>';controls.innerHTML=''}
render();
</script></body></html>
