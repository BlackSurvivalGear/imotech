<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ImoTech Consultation</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:Inter,sans-serif}.choice{transition:.2s}.choice.selected{background:#2563eb;color:#fff;border-color:#2563eb}.bubble{animation:in .25s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.summary-card{background:linear-gradient(135deg,#eff6ff,#f8fafc)}</style></head>
<body class="bg-slate-100 text-slate-900 min-h-screen"><main class="max-w-2xl mx-auto p-4 md:p-8"><div class="bg-white rounded-3xl shadow-sm border overflow-hidden"><header class="bg-slate-950 text-white p-5 flex items-center gap-3"><div class="w-11 h-11 rounded-xl bg-blue-600 flex items-center justify-center font-extrabold">iM</div><div><h1 class="font-extrabold">ImoTech Project Assistant</h1><p class="text-xs text-slate-400">Tell us what you need. We'll help shape the solution.</p></div></header><div class="h-1 bg-slate-100"><div id="progress" class="h-full bg-blue-600 transition-all"></div></div><section id="chat" class="p-5 md:p-7 min-h-[420px]"></section><div id="controls" class="px-5 md:px-7 pb-6 flex justify-between gap-3"></div></div></main>
<script>
// Replace after deploying apps-script/Code.gs as a Web App.
const APPS_SCRIPT_URL='PASTE_APPS_SCRIPT_WEB_APP_URL_HERE';
const groups={
'Websites & Online Business':['Business Website','E-commerce Website','Web Application / Platform','Customer / Member Portal','Booking System','Payments / Subscriptions','Domain & Business Email'],
'Business Systems':['Business Management System','Company Intranet','CRM / Customer Management','Dashboards & Reporting','Document / Form Systems','Existing System Improvement'],
'AI & Automation':['AI Assistant / Chatbot','Workflow Automation','AI Document Processing','Business Process Automation','System / API Integration'],
'Branding & Digital Identity':['New Branding','Logo & Visual Identity','Brand Refresh','Website Branding','Digital Assets'],
'New Ideas & Custom Development':['Prototype / MVP','Bespoke Software','New Digital Product',"I'm not sure — help me work it out"]};
const serviceQuestions={
'Business Website':[{q:'Do you already own a domain name?',opts:['Yes','No — I need one','Not sure']},{q:'Do you already have a logo and established branding?',opts:['Yes','Partly','No — I need branding']},{q:'What should visitors be able to do?',multi:true,opts:['Learn about the business','Request a quote','Contact us','Call / WhatsApp','Book an appointment','Make a payment','View previous work']}],
'E-commerce Website':[{q:'What will you sell online?',text:true},{q:'Do you already have products, pricing and images ready?',opts:['Yes','Partly','No']},{q:'Which functions do you expect?',multi:true,opts:['Online payments','Customer accounts','Delivery / shipping','Click & collect','Subscriptions','Stock management']}],
'Company Intranet':[{q:'Roughly how many staff will use the intranet?',opts:['1–10','11–50','51–200','200+']},{q:'What should staff access there?',multi:true,opts:['Documents','Policies','Announcements','Forms','Staff directory','Internal tools','Reports / dashboards']}],
'Business Management System':[{q:'Which areas should the system manage?',multi:true,opts:['Customers','Staff','Jobs / projects','Documents','Invoices / payments','Stock / assets','Reports','Approvals']}],
'AI Assistant / Chatbot':[{q:'Who should the AI assistant help?',multi:true,opts:['Customers','Staff','Management','Website visitors']},{q:'What information should it work with?',multi:true,opts:['Website content','Company documents','FAQs','Customer information','Internal knowledge','Other data']}],
'Workflow Automation':[{q:'Which repetitive work would you most like to automate?',text:true},{q:'Which systems are involved?',multi:true,opts:['Email','Google Workspace','Spreadsheets','CRM','Website','Payments','Other software']}],
'New Branding':[{q:'What branding do you currently have?',multi:true,opts:['Logo','Colours','Fonts','Brand guidelines','Social media assets','Nothing yet']}],
'Logo & Visual Identity':[{q:'Is this for a new business or an existing brand?',opts:['New business','Existing business','Rebrand']}],
'Domain & Business Email':[{q:'Do you already own the domain you want to use?',opts:['Yes','No','Not sure']},{q:'Do you need professional email addresses set up?',opts:['Yes','No','Not sure']}]
};
let state={stage:'groups',groups:[],services:[],description:'',dynamic:[],dynamicAnswers:[],general:{},contact:{}};const chat=document.getElementById('chat'),controls=document.getElementById('controls'),progress=document.getElementById('progress');const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function buttons(items,selected=[],multi=true){return '<div class="grid sm:grid-cols-2 gap-2">'+items.map(x=>`<button type="button" data-value="${esc(x)}" class="choice ${selected.includes(x)?'selected ':''}text-left border rounded-xl p-3 text-sm font-semibold">${esc(x)}</button>`).join('')+'</div>'}
function wireMulti(target){target.querySelectorAll('.choice').forEach(b=>b.onclick=()=>b.classList.toggle('selected'))}function selected(target){return [...target.querySelectorAll('.choice.selected')].map(b=>b.dataset.value)}
function nav(back,next,label='Continue'){controls.innerHTML=`${back?'<button id="back" class="px-5 py-3 rounded-xl font-bold border">Back</button>':'<span></span>'}<button id="next" class="px-6 py-3 rounded-xl font-bold bg-blue-600 text-white">${label}</button>`;if(back)document.getElementById('back').onclick=back;document.getElementById('next').onclick=next}
function setProgress(n){progress.style.width=n+'%'}
function renderGroups(){setProgress(8);chat.innerHTML='<div class="bubble bg-slate-100 rounded-2xl p-4 mb-5"><h2 class="font-extrabold text-lg">What kind of help are you looking for?</h2><p class="text-sm text-slate-500 mt-2">Choose one or more areas. You can fine-tune the services next.</p></div><div id="groupChoices">'+buttons(Object.keys(groups),state.groups)+'</div>';const a=document.getElementById('groupChoices');wireMulti(a);nav(null,()=>{state.groups=selected(a);if(!state.groups.length)return alert('Choose at least one area.');renderServices()})}
function renderServices(){setProgress(18);let html='<div class="bubble bg-blue-50 rounded-2xl p-4 mb-5"><p class="font-semibold">Good. Which services look relevant?</p><p class="text-sm text-slate-500 mt-1">Select as many as apply. The assistant will refine this later.</p></div><div id="serviceChoices" class="space-y-5">';state.groups.forEach(g=>{html+=`<section><h3 class="font-extrabold mb-2">${esc(g)}</h3>${buttons(groups[g],state.services)}</section>`});html+='</div>';chat.innerHTML=html;const a=document.getElementById('serviceChoices');wireMulti(a);nav(renderGroups,()=>{state.services=selected(a);if(!state.services.length)return alert('Choose at least one service.');renderDescription()})}
function renderDescription(){setProgress(28);chat.innerHTML=`<div class="bubble bg-slate-100 rounded-2xl p-4 mb-5"><p class="font-semibold">Now tell me what you're trying to achieve.</p><p class="text-sm text-slate-500 mt-2">Describe it naturally. Don't worry about technical terms — that's what the assistant is for.</p></div><textarea id="description" class="w-full border rounded-xl p-4 min-h-40" placeholder="For example: I have just started a plumbing company and need customers to find me online and request jobs...">${esc(state.description)}</textarea>`;nav(renderServices,()=>{state.description=document.getElementById('description').value.trim();if(state.description.length<10)return alert('Please tell us a little more about what you need.');buildDynamic();renderDynamic(0)})}
function buildDynamic(){state.dynamic=[];const seen=new Set();state.services.forEach(s=>(serviceQuestions[s]||[]).forEach(q=>{const key=q.q;if(!seen.has(key)){seen.add(key);state.dynamic.push({...q,service:s})}}));if(!state.dynamic.length)state.dynamic.push({service:'Project detail',q:'What are the most important things the finished solution must do?',text:true})}
function renderDynamic(i){setProgress(35+Math.min(35,(i/state.dynamic.length)*35));if(i>=state.dynamic.length)return renderGeneral();const q=state.dynamic[i],old=state.dynamicAnswers[i];chat.innerHTML=`<div class="text-xs font-bold text-blue-600 uppercase mb-2">${esc(q.service)}</div><div class="bubble bg-slate-100 rounded-2xl p-4 mb-5"><p class="font-semibold">${esc(q.q)}</p>${q.multi?'<p class="text-xs text-slate-500 mt-2">Choose one or more.</p>':''}</div><div id="dyn">${q.text?`<textarea id="dynText" class="w-full border rounded-xl p-4 min-h-32">${esc(old||'')}</textarea>`:buttons(q.opts,Array.isArray(old)?old:(old?[old]:[]),!!q.multi)}</div>`;const a=document.getElementById('dyn');if(!q.text){a.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(q.multi)b.classList.toggle('selected');else{a.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}})}nav(()=>i?renderDynamic(i-1):renderDescription,()=>{const v=q.text?document.getElementById('dynText').value.trim():selected(a);if(!v.length)return alert('Please add an answer.');state.dynamicAnswers[i]=q.multi?v:v[0];renderDynamic(i+1)})}
function renderGeneral(){setProgress(76);const g=state.general;chat.innerHTML=`<div class="bubble bg-blue-50 rounded-2xl p-4 mb-5"><p class="font-semibold">I have the service details. A few final questions will help ImoTech scope the project.</p></div><div class="space-y-5"><label class="block font-bold">Who will mainly use it?<div id="users" class="mt-2">${buttons(['Me','Staff / team','Customers','Management','Suppliers / partners','Public users'],g.users||[])}</div></label><label class="block font-bold">What do you use currently?<div id="current" class="mt-2">${buttons(['Spreadsheets','Email / manual processes','Google Workspace','Existing website','CRM / business software','Paper / forms','Nothing yet'],g.current||[])}</div></label><label class="block font-bold">When would you like to start?<select id="timeline" class="mt-2 w-full border rounded-xl p-3"><option>${esc(g.timeline||'As soon as possible')}</option><option>Within a month</option><option>1–3 months</option><option>3–6 months</option><option>Just researching</option></select></label><label class="block font-bold">Budget guidance<select id="budget" class="mt-2 w-full border rounded-xl p-3"><option>${esc(g.budget||'I need advice')}</option><option>Under £1,000</option><option>£1,000–£3,000</option><option>£3,000–£10,000</option><option>£10,000+</option><option>Prefer not to say</option></select></label></div>`;wireMulti(document.getElementById('users'));wireMulti(document.getElementById('current'));nav(()=>renderDynamic(state.dynamic.length-1),()=>{state.general={users:selected(document.getElementById('users')),current:selected(document.getElementById('current')),timeline:document.getElementById('timeline').value,budget:document.getElementById('budget').value};renderContact()})}
function renderContact(){setProgress(88);const c=state.contact;chat.innerHTML=`<div class="bubble bg-slate-100 rounded-2xl p-4 mb-5"><p class="font-semibold">Last step — where should ImoTech send your consultation summary?</p></div><div class="space-y-3"><input id="name" class="w-full border rounded-xl p-3" placeholder="Your name" value="${esc(c.name||'')}"><input id="business" class="w-full border rounded-xl p-3" placeholder="Business / organisation" value="${esc(c.business||'')}"><input id="email" type="email" class="w-full border rounded-xl p-3" placeholder="Email address" value="${esc(c.email||'')}"><input id="phone" class="w-full border rounded-xl p-3" placeholder="Phone (optional)" value="${esc(c.phone||'')}"></div>`;nav(renderGeneral,()=>{state.contact={name:document.getElementById('name').value.trim(),business:document.getElementById('business').value.trim(),email:document.getElementById('email').value.trim(),phone:document.getElementById('phone').value.trim()};if(!state.contact.name||!state.contact.email)return alert('Name and email are required.');renderReview()})}
function renderReview(){setProgress(95);const detail=state.dynamic.map((q,i)=>`<div class="border-t pt-3"><p class="text-xs font-bold text-slate-400">${esc(q.q)}</p><p>${esc(Array.isArray(state.dynamicAnswers[i])?state.dynamicAnswers[i].join(', '):state.dynamicAnswers[i])}</p></div>`).join('');chat.innerHTML=`<div class="bubble"><h2 class="text-2xl font-extrabold">Ready for AI-assisted review</h2><p class="text-slate-600 mt-2 mb-5">ImoTech will use your selections and description to identify the services that best fit your actual requirement.</p><div class="summary-card border rounded-2xl p-4 mb-4"><p class="text-xs font-bold text-blue-600">SELECTED SERVICES</p><p class="font-bold mt-1">${esc(state.services.join(', '))}</p></div><div class="space-y-3 text-sm"><div><p class="font-bold">In your words</p><p class="text-slate-600">${esc(state.description)}</p></div>${detail}</div></div>`;nav(renderContact,submit,'Analyse & submit')}
async function submit(){if(APPS_SCRIPT_URL.includes('PASTE_'))return alert('The ImoTech consultation backend has not been connected yet.');controls.innerHTML='<span></span><button disabled class="px-6 py-3 rounded-xl font-bold bg-slate-400 text-white">Analysing…</button>';try{const payload={groups:state.groups,services:state.services,description:state.description,serviceAnswers:state.dynamic.map((q,i)=>({service:q.service,question:q.q,answer:state.dynamicAnswers[i]})),general:state.general,contact:state.contact};const r=await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});const data=await r.json();if(!data.ok)throw new Error(data.error||'Submission failed');setProgress(100);chat.innerHTML=`<div class="text-center py-10"><div class="w-14 h-14 rounded-full bg-green-100 text-green-700 flex items-center justify-center mx-auto mb-4 text-2xl">✓</div><h2 class="text-2xl font-extrabold">Consultation submitted</h2><p class="text-slate-600 mt-3">${esc(data.customerMessage||'Your project brief has been sent to ImoTech. A confirmation has also been sent to your email.')}</p>${data.recommendation?`<div class="summary-card text-left border rounded-2xl p-4 mt-6"><p class="text-xs font-bold text-blue-600">INITIAL RECOMMENDATION</p><p class="mt-2">${esc(data.recommendation)}</p></div>`:''}</div>`;controls.innerHTML=''}catch(e){alert('We could not submit the consultation. Please try again.');renderReview()}}
renderGroups();
</script></body></html>
